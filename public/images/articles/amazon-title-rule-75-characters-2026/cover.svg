  </g>
  <path d="M560 290h76" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <path d="M622 270l28 20-28 20" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(104 402)">
