  <text x="104" y="126" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">重点简报</text>
  <text x="314" y="126" fill="#93c5fd" font-family="Arial, sans-serif" font-size="28" font-weight="700">Amazon Title Rule Update</text>
  <g transform="translate(104 226)">
    <rect width="430" height="128" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
